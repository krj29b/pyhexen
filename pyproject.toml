[project]
name = "pyhexen"
version = "0.1.0"
description = "Python reimplementation of the Hexen (1995) engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.0",
    "moderngl>=5.10.0",
    "numpy>=2.0.0",
    "mapbox-earcut>=1.0.2",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
perf = [
    "numba>=0.60.0",
]
audio = [
    "pyfluidsynth>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "mido>=1.3.0",
]

[project.scripts]
pyhexen = "pyhexen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyhexen"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
markers = [
    "wad: tests requiring a user-supplied HEXEN.WAD IWAD",
    "gl: tests requiring an OpenGL context",
    "slow: slow integration or benchmark tests",
]
